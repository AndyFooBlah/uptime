# Starts probe.yml through the GitHub API. Cloud Scheduler runs this at :41
# every hour, because GitHub's own cron runs hours late on this account.
# The token is read from Secret Manager and never logged: call logging and
# execution history stay off (the defaults), and nothing returns it.
main:
  steps:
    - read_token:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: github-probe-dispatch
          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
        result: token
    - dispatch:
        try:
          call: http.post
          args:
            url: https://api.github.com/repos/AndyFooBlah/uptime/actions/workflows/probe.yml/dispatches
            headers:
              Authorization: ${"Bearer " + token}
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
              User-Agent: uptime-dispatcher
            body:
              ref: main
            timeout: 30
          result: resp
        retry: ${http.default_retry_non_idempotent}
    - done:
        return: ${resp.code}
