# Hourly HTTP probe of every live app, plus a daily headless-browser UI check.
# A failing target opens (or updates) one issue assigned to the owner; the
# issue closes itself when the target recovers. Targets live in the
# PROBE_TARGETS secret; see README.md.
#
# Cloud Scheduler starts this every hour at :41 through workflow_dispatch (see
# dispatcher/), because GitHub's own cron runs hours late on this account. The
# GitHub cron below is only a watchdog: when it fires, it checks that a
# dispatched run happened recently, and runs the probe itself if not.
name: probe

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      ui:
        description: Also run the headless-browser UI checks
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  # Scheduled runs only: is the Cloud Scheduler dispatcher alive?
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: AndyFooBlah
    steps:
      - id: check
        run: |
          set -euo pipefail
          last=$(gh run list --workflow probe.yml --event workflow_dispatch --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          title="Down: dispatcher (schedule)"
          gh label create down --color B60205 --description "A probe is failing" --force >/dev/null
          num=$(gh issue list --label down --state open --json number,title | jq -r --arg t "$title" '.[] | select(.title==$t) | .number')
          # Three missed hours, so one slow dispatch doesn't page anyone.
          if [ "$age" -gt 10800 ]; then
            echo stale=true >> "$GITHUB_OUTPUT"
            body="No dispatched probe run since ${last:-ever}. Check the probe-dispatch Cloud Scheduler job and Workflow in andybrook-uptime, and the github-probe-dispatch token (expired?). This scheduled run probes in its place. Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            if [ -z "$num" ]; then
              gh issue create --title "$title" --label down --assignee "$OWNER" --body "$body"
            else
              gh issue comment "$num" --body "Still stale. $body"
            fi
          else
            echo stale=false >> "$GITHUB_OUTPUT"
            [ -z "$num" ] || gh issue close "$num" --comment "Dispatched runs are back (last at $last)."
          fi

  probe:
    needs: watchdog
    # Dispatched runs always probe; scheduled runs only when the dispatcher is down.
    if: always() && (github.event_name != 'schedule' || needs.watchdog.outputs.stale == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: AndyFooBlah
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # UI checks once a day at 15:41 UTC (08:41 PDT / 07:41 PST), or on request.
      - name: Decide on UI checks
        id: mode
        run: |
          if [ "${{ inputs.ui }}" = true ] || [ "$(date -u +%H)" = 15 ]; then echo "ui=--ui" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci --ignore-scripts
      - if: steps.mode.outputs.ui != ''
        run: npx playwright install --with-deps chromium >/dev/null
      - name: Probe
        env:
          PROBE_TARGETS: ${{ secrets.PROBE_TARGETS }}
        run: node probe.mjs ${{ steps.mode.outputs.ui }} --out results.json
      - name: Open, update or close issues
        run: |
          set -euo pipefail
          gh label create down --color B60205 --description "A probe is failing" --force >/dev/null
          open=$(gh issue list --label down --state open --json number,title --limit 100)
          # One issue per target and check kind, so an HTTP-only hourly run
          # never closes an issue about the daily UI check.
          jq -c '.[]' results.json | while read -r r; do
            name=$(jq -r .name <<<"$r"); kind=$(jq -r .kind <<<"$r")
            title="Down: $name ($kind)"
            num=$(jq -r --arg t "$title" '.[] | select(.title==$t) | .number' <<<"$open")
            if [ "$(jq -r .ok <<<"$r")" = false ]; then
              body=$(printf '%s\n\nRun: %s/%s/actions/runs/%s\n' "$(jq -r .error <<<"$r")" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
              if [ -z "$num" ]; then
                gh issue create --title "$title" --label down --assignee "$OWNER" --body "$body"
              else
                gh issue comment "$num" --body "Still failing. $body"
              fi
            elif [ -n "$num" ]; then
              gh issue close "$num" --comment "Recovered."
            fi
          done
      - name: Summary
        if: always()
        run: |
          [ -f results.json ] || exit 0
          { echo "| target | check | result |"; echo "|---|---|---|";
            jq -r '.[] | "| \(.name) | \(.kind) | \(if .ok then "ok" else "**FAIL** " + .error end) |"' results.json; } >> "$GITHUB_STEP_SUMMARY"

  # Scheduled workflows in a public repo stop after 60 days without activity,
  # which would take the watchdog with them. Commit at most once a week.
  heartbeat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Weekly heartbeat commit
        run: |
          last=$(git log -1 --format=%ct)
          [ $(( $(date +%s) - last )) -gt 518400 ] || exit 0
          date -u +%Y-%m-%dT%H:%MZ > HEARTBEAT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEARTBEAT && git commit -q -m "heartbeat" && git push -q
